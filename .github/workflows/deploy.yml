name: Deploy to GitHub Pages

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Configure public domain
        run: |
          echo "SITE_URL=https://trias-schule.it" >> "$GITHUB_ENV"
          echo "BASE_PATH=/" >> "$GITHUB_ENV"

      - name: Check Astro diagnostics
        run: npm run check

      - name: Build Astro
        env:
          PUBLIC_INQUIRY_ENDPOINT: ${{ vars.PUBLIC_INQUIRY_ENDPOINT }}
        run: npm run build

      # The previous design (before the Maßkette redesign), kept at /old/ for comparison.
      - name: Build previous version at /old/
        env:
          PUBLIC_INQUIRY_ENDPOINT: ${{ vars.PUBLIC_INQUIRY_ENDPOINT }}
          OLD_REF: 0c0011879ee8e1d85e258814256a88569d6eaad8
        run: |
          git fetch --no-tags --depth=1 origin "$OLD_REF"
          git worktree add --detach ../old "$OLD_REF"
          ln -s "$GITHUB_WORKSPACE/node_modules" ../old/node_modules
          (cd ../old && BASE_PATH=/old/ npx astro build)
          rm -f ../old/dist/CNAME ../old/dist/robots.txt ../old/dist/sitemap.xml
          find ../old/dist -name '*.html' -exec sed -i 's|<head>|<head><meta name="robots" content="noindex">|' {} +
          cp -r ../old/dist ./dist/old

      - name: Upload artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
